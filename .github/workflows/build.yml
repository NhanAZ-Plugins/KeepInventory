name: Build and validate plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test inventory retention rules
    runs-on: ubuntu-24.04
    steps:
      - name: Check out KeepInventory source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run world selection cases
        run: php tests/inventory-policy.php

  build:
    needs: test
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@v3
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      phpstan: max
